name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gru-inference-lock.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu --no-deps
      - name: Install pinned inference dependencies
        run: python -m pip install -r requirements-gru-inference-lock.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
